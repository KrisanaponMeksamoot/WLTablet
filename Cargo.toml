[package]
name = "wltablet"
version = "0.1.0"
edition = "2024"
authors = ["Krisanapon Meksamoot"]
description = "WebRTC-powered wireless graphic tablet for Linux Wayland/X11"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["ws"]}
tower-http = { version = "0.5", features = ["fs"] }
tokio-tungstenite = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webrtc = "0.11"
zbus = "4.0"
futures-util = "0.3"
thiserror = "2.0.18"
x11rb = { version = "0.13.2", features = ["xtest"] }
