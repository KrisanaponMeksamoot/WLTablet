<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>WLTablet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="center-container">
      <canvas id="inputArea"></canvas>
    </div>
    <button id="settingsButton" class="settings-toggle" type="button">Settings</button>

    <div id="overlay" class="overlay">
      <div class="panel">
        <h1>WLTablet</h1>
        <p>Enter a 6-digit pairing PIN from the server.</p>
        <form id="pinForm">
          <input
            id="pinInput"
            type="text"
            inputmode="numeric"
            pattern="\d{6}"
            maxlength="6"
            placeholder="000000"
            autocomplete="one-time-code"
          />
          <button type="submit">Pair</button>
        </form>
        <div id="status" class="status">Waiting for PIN...</div>
      </div>
    </div>

    <div id="settingsOverlay" class="overlay settings-overlay" hidden>
      <div class="panel settings-panel">
        <div class="panel-header">
          <h2>Settings</h2>
          <button id="closeSettingsButton" class="secondary-button" type="button">Close</button>
        </div>

        <form id="settingsForm" class="settings-form">
          <div class="field-group">
            <h3>Canvas</h3>
            <label class="field">
              <span>Width</span>
              <input id="canvasWidth" type="number" min="1" step="1">
            </label>
            <label class="field">
              <span>Height</span>
              <input id="canvasHeight" type="number" min="1" step="1">
            </label>
            <label class="checkbox-row">
              <input id="preserveAspect" type="checkbox" checked>
              <span>Preserve aspect ratio</span>
            </label>
          </div>

          <div class="field-group">
            <h3>Connection</h3>
            <label class="checkbox-row">
              <input id="rememberPin" type="checkbox">
              <span>Remember PIN</span>
            </label>
            <label class="checkbox-row">
              <input id="autoConnect" type="checkbox">
              <span>Auto connect</span>
            </label>
          </div>

          <button id="resetSetting" class="settings-save">Reset</button>
          <button type="submit" class="settings-save">Save settings</button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
