<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>WLTablet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="pointerCanvas"></canvas>
    <div id="overlay" class="overlay">
      <div class="panel">
        <h1>WLTablet</h1>
        <p>Enter a 6-digit pairing PIN from the server.</p>
        <form id="pinForm">
          <input
            id="pinInput"
            type="text"
            inputmode="numeric"
            pattern="\d{6}"
            maxlength="6"
            placeholder="000000"
            autocomplete="one-time-code"
          />
          <button type="submit">Pair</button>
        </form>
        <div id="status" class="status">Waiting for PIN...</div>
      </div>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
